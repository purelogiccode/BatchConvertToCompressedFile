name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 2.0.0, without the leading v)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the MAJOR.MINOR.PATCH format, got: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Package ${{ matrix.rid }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RID: ${{ matrix.rid }}
        run: >
          dotnet publish BatchConvertToCompressedFile/BatchConvertToCompressedFile.csproj
          -c Release -r "$RID" --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -p:Version="$VERSION"
          -p:AssemblyVersion="$VERSION.0"
          -p:FileVersion="$VERSION.0"
          -p:InformationalVersion="$VERSION"
          -o "artifacts/$RID"

      - name: Add bundle documents
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          find "artifacts/$RID" -maxdepth 1 -type f \( -name '*.xml' -o -name '*.pdb' \) -delete
          cp LICENSE ReadMe.md WhatsNew.md "artifacts/$RID/"
          ls -la "artifacts/$RID"

      - name: Package (.zip for Windows)
        if: startsWith(matrix.rid, 'win-')
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          cd "artifacts/$RID"
          zip -r "../BatchConvertToCompressedFile_${VERSION}_${RID}.zip" .
          cd ..
          rm -rf "$RID"

      - name: Package (.tar.gz for Linux and macOS)
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          python3 scripts/package-tar.py \
            "artifacts/$RID" \
            "artifacts/BatchConvertToCompressedFile_${VERSION}_${RID}.tar.gz"
          rm -rf "artifacts/$RID"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: artifacts/BatchConvertToCompressedFile_*
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: artifacts

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum BatchConvertToCompressedFile_* > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Batch Convert to Compressed File v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: WhatsNew.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            artifacts/BatchConvertToCompressedFile_*
            artifacts/checksums.txt
