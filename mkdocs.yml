site_name: Batch Convert to Compressed File
site_description: Cross-platform batch archive compression and verification utility.
site_url: https://purelogiccode.github.io/BatchConvertToCompressedFile/
repo_url: https://github.com/purelogiccode/BatchConvertToCompressedFile
repo_name: purelogiccode/BatchConvertToCompressedFile
edit_uri: edit/master/docs/

docs_dir: docs
site_dir: _site

theme:
  name: material
  language: en
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

exclude_docs: |
  _Sidebar.md
  _Footer.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - What's new: whats-new.md
  - Getting started: getting-started.md
  - User guide: user-guide.md
  - Configuration: configuration.md
  - Logging and bug reports: logging-and-bug-reports.md
  - Donation: donation.md
  - Statistics: statistics.md
  - Architecture: architecture.md
  - Building and testing: building-and-testing.md
  - CI/CD: ci-cd.md
  - Release process: release-process.md
  - Security: security.md
  - Manual testing: manual-testing.md
  - Validation report: validation-report.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Contributing: contributing.md
